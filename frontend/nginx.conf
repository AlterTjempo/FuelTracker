server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Content-Security-Policy. Only what the app really needs:
    #  - Google reCAPTCHA (script + frame) for sign-up, only when configured
    #  - an OpenStreetMap map frame, which the station page loads only after a click
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    server_tokens off;
    client_max_body_size 64k;

    # If another reverse proxy (Traefik, Nginx Proxy Manager, Cloudflare...) sits IN FRONT of this
    # container, nginx only sees that proxy's address and per-visitor rate limiting breaks.
    # Then trust it and take the real address from its header, for example:
    #   set_real_ip_from 172.16.0.0/12;     # the proxy's network
    #   real_ip_header   X-Forwarded-For;
    #   real_ip_recursive on;

    # Compress text assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything in /assets, so it can be cached for a year.
    # (`expires` is used instead of add_header so the security headers above
    # keep applying to this location.)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Svelte / SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Stuur API verzoeken direct door naar de FastAPI backend container
    location /api {
        proxy_pass http://fuel_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}