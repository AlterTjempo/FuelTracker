services:
  db:
    image: postgres:16
    container_name: fuel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: fuel
      POSTGRES_DB: fuelprices
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Reachable from this machine only by default. To use DBeaver/Kuma from elsewhere set
      # DB_BIND in a .env file next to this file (see config.env.example), e.g. DB_BIND=0.0.0.0
      - "${DB_BIND:-127.0.0.1}:5432:5432"

  backend:
    build: ./backend
    container_name: fuel_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - config.env
    environment:
      DATABASE_URL: postgresql://fuel:fuel@db:5432/fuelprices
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./backend/app:/app

  frontend:
    build: ./frontend
    container_name: fuel_web
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - config.env
    ports:
      - "5173:80"

volumes:
  pgdata: