name: CI - Build and Check

# This workflow runs automatically when you push code or create a pull request
on:
  push:
    branches: [ prod, development ]
  pull_request:
    branches: [ prod, development ]

jobs:
  # Job 1: Check the backend (Python/FastAPI)
  backend-check:
    name: Backend Build & Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # Download your code from the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'
      
      # Install Python dependencies
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install development tools for code quality checks
          pip install flake8 black pytest pytest-asyncio httpx
      
      # Check code formatting with Black
      - name: Check code formatting
        working-directory: ./backend
        run: black --check app/
      
      # Lint Python code for errors
      - name: Lint with flake8
        working-directory: ./backend
        run: |
          # Check for syntax errors and undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check for style issues (but don't fail the build)
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      # Run tests with pytest
      - name: Run tests
        working-directory: ./backend
        run: |
          # Run pytest with coverage if tests exist
          if [ -d "tests" ] || find app -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v
          else
            echo "No tests found - skipping test execution"
            echo "Note: Add tests in a 'tests' directory or with test_*.py naming"
          fi
      
      # Build Docker image to ensure it works
      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t fueltracker-backend:test .

  # Job 2: Check the frontend (Node/Svelte)
  frontend-check:
    name: Frontend Build & Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # Download your code from the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'
      
      # Install Node.js dependencies
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      
      # Build the Svelte application
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      # Build Docker image to ensure it works
      - name: Build Docker image
        working-directory: ./frontend
        run: docker build -t fueltracker-frontend:test .

  # Job 3: Validate Docker Compose configuration
  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      # Download your code from the repository
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Create a dummy config.env file for testing
      - name: Create test config
        run: |
          cp config.env.example config.env
          # Replace the API key placeholder with a test value
          sed -i 's/TANKERKONIG_API_KEY=your-api-key-here/TANKERKONIG_API_KEY=test-key-12345/' config.env
      
      # Validate docker-compose.yml syntax
      - name: Validate Docker Compose configuration
        run: docker compose config > /dev/null
